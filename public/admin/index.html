<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Shane's Hair Studio Content Manager</title>
  </head>
  <body>
    <noscript>JavaScript is required to use the content manager.</noscript>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      (async function initCms() {
        try {
          const response = await fetch('/admin/config.yml', {
            cache: 'no-store',
          });
          const yaml = await response.text();
          const config = jsyaml.load(
            yaml.replaceAll('__SITE_ORIGIN__', window.location.origin),
          );
          config.load_config_file = false;
          window.initCMS({ config });
        } catch (error) {
          document.body.innerHTML =
            '<p style="font-family: system-ui, sans-serif; padding: 24px;">Could not load the content manager configuration.</p>';
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
